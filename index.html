<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Infláció Érzékelő</title>
</head>
<body>
    <h1>Aktuális infláció</h1>
    <div id="adat">Betöltés...</div>

    <script>
        // Ide írd a Published to web CSV linket:
        const csvUrl = "IDE_TEDD_A_PUBLISH_LINKET";

        fetch(csvUrl)
            .then(res => res.text())
            .then(data => {
                const rows = data.split("\n");
                const latest = rows[rows.length - 1].split(","); // Az utolsó sor
                document.getElementById('adat').innerText = "Az infláció: " + latest[1] + "%";
            });
    </script>
</body>
</html>
