<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Inflációkövető</title>
</head>
<body>
    <h1>Inflációs Adatok</h1>
    <table id="tabla" border="1">
        <thead><tr><th>Dátum</th><th>Infláció (%)</th></tr></thead>
        <tbody id="tbody"></tbody>
    </table>

    <script>
        // Ez a TE publikált CSV linked
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStI14U-qxq-UOxJrr-9Li2Sqh53RC00Dvw3PvLt12Bz3nzXTepuRKtHMFya3B5X4OpLfHScQqJOrnl/pub?gid=0&single=true&output=csv';

        fetch(csvUrl)
            .then(response => response.text())
            .then(data => {
                const tbody = document.getElementById('tbody');
                const rows = data.split('\n');
                
                if (rows.length > 1) {
                    for (let i = 1; i < rows.length; i++) {
                        if (rows[i].trim() === '') continue;
                        const cols = rows[i].split(',');
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td>${cols[0]}</td><td>${cols[1]}</td>`;
                        tbody.appendChild(tr);
                    }
                } else {
                    document.body.innerHTML += "<p>Hiba: Nem érkezett adat a táblázatból.</p>";
                }
            })
            .catch(err => {
                document.body.innerHTML += "<p>Hiba a betöltéskor: " + err + "</p>";
            });
    </script>
</body>
</html>
