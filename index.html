<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Infláció</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f0f2f5; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; }
        h1 { font-size: 20px; color: #555; }
        #adat { font-size: 60px; font-weight: bold; color: #ff4757; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Aktuális infláció</h1>
        <div id="adat">Betöltés...</div>
    </div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vStI14U-qxq-UOxJrr-9Li2Sqh53RC00Dvw3PvLt12Bz3nzXTepuRKtHMFya3B5X4OpLfHScQqJOrnl/pub?output=csv";

        fetch(csvUrl)
            .then(res => res.text())
            .then(data => {
                // A sorokat szétbontjuk és a legutolsót vesszük
                const lines = data.trim().split("\n");
                const lastLine = lines[lines.length - 1];
                const cells = lastLine.split(",");
                // A második oszlop (index 1)
                document.getElementById('adat').innerText = cells[1] + "%";
            });
    </script>
</body>
</html>
