<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Infláció Érzékelő</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fafafa; color: #333; line-height: 1.6; padding: 40px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2d3436; }
        .adat-doboz { background: #f8f9fa; border-left: 5px solid #ff4757; padding: 20px; margin: 20px 0; }
        .szam { font-size: 32px; font-weight: bold; color: #ff4757; }
        .datum { color: #636e72; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Inflációs körkép</h1>
        <p>Így alakultak az árak mostanában. A KSH legfrissebb adata alapján:</p>
        
        <div class="adat-doboz">
            <div class="datum" id="datum-kiiras">Dátum betöltése...</div>
            <div class="szam" id="adat-kiiras">--%</div>
        </div>

        <p>Ez a szám az inflációt mutatja. Szerinted reális? Figyeljük közösen, hogyan változik hónapról hónapra.</p>
    </div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vStI14U-qxq-UOxJrr-9Li2Sqh53RC00Dvw3PvLt12Bz3nzXTepuRKtHMFya3B5X4OpLfHScQqJOrnl/pub?gid=0&single=true&output=csv";

        fetch(csvUrl)
            .then(res => res.text())
            .then(data => {
                const lines = data.trim().split("\n");
                const lastLine = lines[lines.length - 1];
                const cells = lastLine.split(",");
                // cells[0] a dátum, cells[1] az infláció
                document.getElementById('datum-kiiras').innerText = "Frissítve: " + cells[0];
                document.getElementById('adat-kiiras').innerText = cells[1] + "%";
            });
    </script>
</body>
</html>
